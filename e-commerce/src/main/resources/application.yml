spring:
  application:
    name: e-commerce

  datasource:
    url: jdbc:mysql://localhost:3306/send_box?serverTimezone=UTC&characterEncoding=UTF-8
    username: root
    password: root1234

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        show_sql: true
        format_sql: true
        default_batch_fetch_size: 1000
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: prometheus # 프로메테우스 엔드포인트 개방
  metrics:
    tags:
      application: ${spring.application.name} # 그라파나에서 서비스 구분을 위한 태그

server:
  port: 8000
