global:
  scrape_interval: 15s # 15초마다 메트릭을 수집

scrape_configs:
  - job_name: 'spring-boot-msa'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets:
          - 'host.docker.internal:8000' # e-commerce
          #- 'host.docker.internal:8001' # inventory
          #- 'host.docker.internal:8002' # orders