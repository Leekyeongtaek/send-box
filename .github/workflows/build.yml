name: My Operation CI & Docker Package

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 최신 코드 가져오기
        uses: actions/checkout@v4

      - name: JDK 17 세팅
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Gradle 실행 권한 부여
        run: chmod +x gradlew

      - name: my-operation 모듈 빌드 (.jar 생성)
        run: ./gradlew :my-operation:build

      - name: Docker 이미지 빌드 및 .tar로 압축
        run: |
          # my-operation 폴더로 이동하여 도커 파일 실행
          cd my-operation
          docker build -t my-operation-image:latest .
          # 만들어진 이미지를 tar 파일로 추출
          docker save -o my-operation-image.tar my-operation-image:latest

      - name: 추출된 Docker tar 파일을 깃허브에 업로드
        uses: actions/upload-artifact@v4
        with:
          name: my-operation-docker-image
          path: my-operation/my-operation-image.tar